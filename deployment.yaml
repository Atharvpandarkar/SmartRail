apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartrail
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smartrail
  template:
    metadata:
      labels:
        app: smartrail
    spec:
      containers:
      - name: smartrail
        image: atharv1923/smartrail:1.0
        ports:
        - containerPort: 5000
